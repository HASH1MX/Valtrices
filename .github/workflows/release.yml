# Builds the Windows installer and attaches it to a GitHub Release.
#
# - Push a tag like v0.1.0  -> builds, creates a PUBLISHED release for that tag, attaches the installer.
#   A tag containing a hyphen (v0.2.0-rc.1) is marked as a pre-release and never shown as "Latest".
#   Set releaseDraft to true below if you prefer to review and publish releases by hand.
# - "Run workflow" by hand    -> builds only; the installer is attached to the workflow run as an artifact.
#
# Repository variables (Settings -> Secrets and variables -> Actions -> Variables), both optional:
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY
# They are compiled into the frontend. Without them the app builds and shows "Not configured".

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint and format check
        run: pnpm check

      - name: Build installer (and publish the GitHub Release when triggered by a tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Valtrices ${{ github.ref_name }}"
          releaseBody: "Download the `Valtrices_*_x64-setup.exe` file below, run it, then launch Valtrices from the Start menu."
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Upload installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: valtrices-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
